name: Daily Telegram digest
on:
  push:
    paths-ignore:
      - 'state.json'
  schedule:
    - cron: '7 6 * * *'
  workflow_dispatch:
    inputs:
      send:
        description: 'Send to Telegram (false previews only)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: daily-digest
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Build or send digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND: ${{ github.event_name == 'schedule' || inputs.send }}
        run: |
          if [ "$SEND" = "true" ]; then
            python digest.py
          else
            python digest.py --dry-run
          fi
      - name: Save delivery history
        if: success() && (github.event_name == 'schedule' || inputs.send)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m 'Save digest delivery history'
          git push
